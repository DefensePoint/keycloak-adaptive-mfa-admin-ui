adaptive-mfa-client-id-description=Configure which client IDs should trigger additional risk checks and their relative weight in the overall risk score.
adaptive-mfa-ip-address-description=Configure IP address-based risk checks. Whitelist trusted IP ranges and blacklist known malicious addresses.
adaptive-mfa-geo-loc-description=Detect logins from countries different from the user's usual location. Higher weight means geography has more influence on the risk score. Depends on IP geolocation: if the engine cannot resolve the client IP to a location (private or proxied IPs, or lookups rate-limited without an IPINFO_TOKEN), this signal is enabled but has no effect.
adaptive-mfa-vpn-mask-description=Detect logins originating from VPN services, Tor exit nodes, or anonymous proxies.
adaptive-mfa-browser-window-description=Evaluate the browser resolution and window size reported during login to identify unusual devices.
adaptive-mfa-date-time-description=Detect logins at unusual times or days that deviate from the user's historical patterns.
adaptive-mfa-device-description=Identify logins from new or unrecognised devices based on browser fingerprint and user-agent characteristics.
adaptive-mfa-in-active-account-description=Flag accounts that have been inactive for an extended period, as a sudden login may indicate account compromise.
adaptive-mfa-operating-system-description=Evaluate the operating system reported during login and compare against the user's historical OS patterns.
adaptive-mfa-risk-type-class-description=Flag logins whose overall pattern, the combination of the other enabled signals such as device, browser, operating system, language and screen, does not match any of the user's usual login patterns.
adaptive-mfa-screen-resolution-description=Evaluate the screen resolution reported during login and compare against the user's historical patterns.
adaptive-mfa-system-language-description=Detect logins where the browser language differs significantly from the user's historical language preferences.
adaptive-mfa-time-interval-description=Analyse the time elapsed between consecutive login attempts to detect impossible travel or credential stuffing.
concurrentSession=Concurrent Session
loginFailure=Login Failure
recentAccountChange=Recent Account Change
adaptive-mfa-concurrent-session-description=Detect concurrent sessions for one account: many distinct source IPs in the active window suggests credential sharing, while many logins from a single IP suggests automated activity.
adaptive-mfa-login-failure-description=Analyse recent login failures for high failure rates, distributed brute-force across many IPs, bot-like timing regularity, and activity bursts.
adaptive-mfa-recent-account-change-description=Raise risk on a login that follows a recent sensitive account change (password change or reset, MFA credential added or removed, email change) within the configured window - the classic account-takeover pattern.
geoClusterLabel=Geolocation Cluster
impossibleTravel=Impossible Travel
adaptive-mfa-geolocation-cluster-description=Flag logins whose location falls outside the user's usual geographic clusters (a rare or previously unseen location relative to their history). Depends on IP geolocation: if the engine cannot resolve the client IP to a location (private or proxied IPs, or lookups rate-limited without an IPINFO_TOKEN), this signal is enabled but has no effect.
adaptive-mfa-impossible-travel-description=Flag logins that would require an impossible travel speed between the user's consecutive login locations. Depends on IP geolocation: if the engine cannot resolve the client IP to a location (private or proxied IPs, or lookups rate-limited without an IPINFO_TOKEN), this signal is enabled but has no effect.
