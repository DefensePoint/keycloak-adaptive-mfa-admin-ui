adaptive-mfa-risk-scoring-description=Choose how risk is combined into an ACR decision. Weight-based averages per-parameter weights. Log-Odds Bayesian produces a continuous fraud probability calibrated by a bias term (more negative = more trusting) mapped to ACR bands by the thresholds.
